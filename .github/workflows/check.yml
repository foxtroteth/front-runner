name: Check Cikal Notifications

on:
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable debug mode (saves screenshots as artifacts)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

concurrency:
  group: check-notifications
  cancel-in-progress: false   # let the current run finish; queue the next one

jobs:
  check:
    runs-on: ubuntu-22.04
    permissions:
      contents: write   # needed to commit state.json back
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Portal reachability probe (diagnostic, non-fatal)
        run: |
          curl -sS -m 15 -o /dev/null -w "portal:  HTTP %{http_code} in %{time_total}s (ip %{remote_ip})\n" https://community.cikal.co.id/ || echo "portal:  UNREACHABLE (curl exit $?)"
          curl -sS -m 15 -o /dev/null -w "control: HTTP %{http_code} in %{time_total}s\n" https://www.google.com/ || echo "control: UNREACHABLE (curl exit $?)"

      - name: Run notification check
        env:
          CIKAL_USERNAME: ${{ secrets.CIKAL_USERNAME }}
          CIKAL_PASSWORD: ${{ secrets.CIKAL_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DEBUG: ${{ github.event.inputs.debug || 'false' }}
        run: python check_notifications.py

      - name: Commit updated state
        # !cancelled(): the script exits 1 on scrape failure AFTER writing
        # consecutive_failures to state.json — that counter must still be
        # committed or the 10-failure Discord alert can never fire
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "No state changes — skipping commit."
            exit 0
          fi
          git commit -m "chore: update notification state [skip ci]"
          # -X theirs keeps this run's state.json (the freshest) if a
          # concurrent run pushed its own state commit in the meantime
          git pull --rebase -X theirs origin main
          git push
