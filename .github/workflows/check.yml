name: Check Cikal Notifications

on:
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable debug mode (saves screenshots as artifacts)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

concurrency:
  group: check-notifications
  cancel-in-progress: false   # let the current run finish; queue the next one

jobs:
  check:
    runs-on: ubuntu-22.04
    permissions:
      contents: write   # needed to commit state.json back
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v2

      - name: Install Playwright Chromium + dependencies
        run: playwright install --with-deps chromium

      - name: Run notification check
        env:
          CIKAL_USERNAME: ${{ secrets.CIKAL_USERNAME }}
          CIKAL_PASSWORD: ${{ secrets.CIKAL_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEBUG: ${{ github.event.inputs.debug || 'false' }}
        run: python check_notifications.py

      - name: Upload screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: debug_*.png
          if-no-files-found: ignore

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "No state changes — skipping commit."
            exit 0
          fi
          git commit -m "chore: update notification state [skip ci]"
          git pull --rebase origin main
          git push
