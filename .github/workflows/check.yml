name: Check Cikal Notifications

on:
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable debug mode (saves screenshots as artifacts)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]
  schedule:
    # Cron.org only calls the webhook during 06:30-09:00 and 12:00-17:00
    # GMT+7; this covers the 11:00-11:59 GMT+7 hour of the afternoon
    # window. The script's own schedule gate makes extra fires harmless.
    - cron: "*/5 4 * * 1-5"

concurrency:
  group: check-notifications
  cancel-in-progress: false   # let the current run finish; queue the next one

jobs:
  check:
    runs-on: ubuntu-22.04
    permissions:
      contents: write   # needed to commit state.json back
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(pip show playwright | grep ^Version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: playwright install --with-deps chromium

      - name: Install Playwright Chromium (from cache, binary only)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: playwright install chromium

      - name: Run notification check
        env:
          CIKAL_USERNAME: ${{ secrets.CIKAL_USERNAME }}
          CIKAL_PASSWORD: ${{ secrets.CIKAL_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          DEBUG: ${{ github.event.inputs.debug || 'false' }}
        run: python check_notifications.py

      - name: Upload screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: debug_*.png
          if-no-files-found: ignore

      - name: Commit updated state
        # !cancelled(): the script exits 1 on scrape failure AFTER writing
        # consecutive_failures to state.json — that counter must still be
        # committed or the 10-failure Discord alert can never fire
        if: ${{ !cancelled() }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "No state changes — skipping commit."
            exit 0
          fi
          git commit -m "chore: update notification state [skip ci]"
          # -X theirs keeps this run's state.json (the freshest) if a
          # concurrent run pushed its own state commit in the meantime
          git pull --rebase -X theirs origin main
          git push
