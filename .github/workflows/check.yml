name: Check Cikal Notifications

on:
  schedule:
    # All times in UTC. Target windows: Mon-Fri 06:30-09:00 and 11:00-17:00 GMT+7.
    # GMT+7 → UTC: subtract 7 hours.

    # Morning window (Mon-Fri 06:30-09:00 GMT+7):
    - cron: "30-55/5 23 * * 0-4"   # Sun-Thu 23:30-23:55 UTC = Mon-Fri 06:30-06:55 GMT+7
    - cron: "*/5 0-1 * * 1-5"      # Mon-Fri 00:00-01:55 UTC = Mon-Fri 07:00-08:55 GMT+7
    - cron: "0 2 * * 1-5"          # Mon-Fri 02:00 UTC      = Mon-Fri 09:00 GMT+7

    # Afternoon window (Mon-Fri 11:00-17:00 GMT+7):
    - cron: "*/5 4-9 * * 1-5"      # Mon-Fri 04:00-09:55 UTC = Mon-Fri 11:00-16:55 GMT+7
    - cron: "0 10 * * 1-5"         # Mon-Fri 10:00 UTC      = Mon-Fri 17:00 GMT+7
  workflow_dispatch:
    inputs:
      debug:
        description: "Enable debug mode (saves screenshots as artifacts)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

jobs:
  check:
    runs-on: ubuntu-22.04
    permissions:
      contents: write   # needed to commit state.json back
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Cache Playwright browser
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-v2

      - name: Install Playwright Chromium + dependencies
        run: playwright install --with-deps chromium

      - name: Run notification check
        env:
          CIKAL_USERNAME: ${{ secrets.CIKAL_USERNAME }}
          CIKAL_PASSWORD: ${{ secrets.CIKAL_PASSWORD }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DEBUG: ${{ github.event.inputs.debug || 'false' }}
        run: python check_notifications.py

      - name: Upload screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_id }}
          path: debug_*.png
          if-no-files-found: ignore

      - name: Commit updated state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state.json
          if git diff --staged --quiet; then
            echo "No state changes — skipping commit."
            exit 0
          fi
          git commit -m "chore: update notification state [skip ci]"
          git pull --rebase origin main
          git push
